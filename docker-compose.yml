services:
  postgres:
    image: postgres:17
    container_name: medstock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medstock
      POSTGRES_USER: medstock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:15431:5432"
    volumes:
      - medstock_pgdata:/var/lib/postgresql/data

volumes:
  medstock_pgdata:
